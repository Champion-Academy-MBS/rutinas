<title>Champion Academy · Adriana Méndez</title>
<style>
:root{
  --bg:#0c0c0e; --bg2:#151518; --card:#1a1a1e; --line:#2a2a30;
  --gold:#4da3ff; --gold2:#9fd0ff; --gold-dim:#1f4f8a; --soft:#0f1b2e; --ink:#04101f; --glow:#4da3ff88; --glow0:#4da3ff00; --tint:#e3f0fd; --deep:#14508f; --deep2:#0f3d6e; --deep3:#2a7bd0;
  --text:#f4f4f5; --muted:#9a9aa3; --ok:#3ecf8e; --ok-soft:#3ecf8e14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;
  background-image:radial-gradient(circle at 1px 1px,#222226 1px,transparent 0);background-size:14px 14px;
  min-height:100vh;min-height:100dvh;padding-bottom:calc(132px + env(safe-area-inset-bottom));overflow-x:hidden}
body:has(.modal.open){overflow:hidden}
button{font:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
#printDoc{display:none}

/* ---------- Header ---------- */
header.hero{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;text-align:center;position:relative;overflow:hidden}
header.hero::before,header.hero::after{content:"";position:absolute;width:54px;height:54px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);opacity:.8;box-shadow:-4px -4px 14px var(--glow)}
header.hero::before{left:-30px;top:44px;transform:rotate(-45deg)}
header.hero::after{right:-30px;top:44px;transform:rotate(135deg)}
.logo{width:min(124px,34vw);margin:0 auto 4px}
.logo img{display:block;width:100%;height:auto}
.hero h1{margin:4px 0 2px;font-size:clamp(1.25rem,5.4vw,1.6rem);font-weight:800;color:var(--gold2);overflow-wrap:anywhere}
.hero .sub{color:var(--muted);font-size:.88rem}

.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 12px}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.78rem;color:var(--muted);text-align:center}
.pill b{color:var(--gold)}
.obj{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.obj h3{margin:0 0 6px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.obj ul{margin:0;padding-left:18px;font-size:.9rem}

/* ---------- Semana ---------- */
.week{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;margin-top:-2px;box-shadow:0 10px 12px -10px #000}
.week-t{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between;gap:8px}
.week-in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;font-size:.66rem;position:relative;min-height:62px}
.tab strong{display:block;font-size:1rem;color:var(--text);margin-top:1px}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.tab.on strong{color:var(--ink)}
.tab.today::after{content:"HOY";white-space:nowrap;width:max-content;position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--gold);border:1px solid var(--gold);font-size:.5rem;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:99px;line-height:1.5}
.ring{--p:0;width:22px;height:22px;border-radius:50%;margin:5px auto 0;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#34343b 0)}
.ring span{width:14px;height:14px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.tab.on .ring{background:conic-gradient(var(--ink) calc(var(--p)*1%),#00000030 0)}
.tab.on .ring span{background:var(--gold)}
.ring.full{background:var(--gold)}
.ring.full span{background:var(--gold);color:var(--ink);font-size:.7rem;font-weight:900}
.tab.on .ring.full{background:var(--ink)}
.tab.on .ring.full span{background:var(--ink);color:var(--gold2)}
.tab.future .ring{opacity:.4}

/* ---------- Día ---------- */
.dayhead{margin:14px 0 14px}
.dayhead h2{margin:0;font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.dayhead small{display:inline-block;color:var(--gold);background:var(--soft);font-weight:700;font-size:.72rem;border-radius:99px;padding:2px 10px;margin-top:6px}
.bar{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold2));border-radius:99px;transition:width .35s}
.barlbl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:6px}
.barlbl b{color:var(--gold2)}

.circ{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.circ-h{background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);font-weight:800;padding:9px 16px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.circ-h em{font-style:normal;font-weight:700;font-size:.72rem;background:#00000018;border-radius:99px;padding:2px 9px;letter-spacing:.02em;text-transform:none;white-space:nowrap}
.ex{padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-n{font-weight:650;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.reps{flex:none;text-align:right;color:var(--gold);font-weight:800;font-size:.95rem;white-space:nowrap}
.reps small{display:block;color:var(--muted);font-weight:500;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em}
.ex-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.note{font-size:.8rem;color:var(--gold2);background:var(--soft);border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 6px 6px 0;display:inline-block}
.dots{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);color:var(--muted);font-weight:700;cursor:pointer;transition:.15s;user-select:none;-webkit-user-select:none}
.dot.on{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:scale(1.05)}
.ex.complete{background:var(--ok-soft)}
.ex.complete .ex-n{color:var(--ok)}
.ex.complete .ex-n::after{content:" ✓"}

.cardio{border-color:var(--gold-dim)}
.cardio .circ-h{background:var(--bg2);color:var(--gold);border-bottom:1px solid var(--gold-dim)}
.cardio .circ-h em{background:#ffffff14}

.rest{text-align:center;padding:24px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;margin-bottom:14px}
.rest b{display:block;font-size:1.1rem;color:var(--text);margin-bottom:4px}
.err{text-align:center;padding:40px 16px;color:var(--muted)}
.err b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}

.actions{display:grid;gap:10px;margin-top:6px}
.btn{display:block;width:100%;min-height:48px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.out{background:none;border-color:var(--gold);color:var(--gold2)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:600;font-size:.82rem}
.slogan{text-align:center;margin:26px 0 8px}.slogan img{display:block;margin:0 auto;max-width:78%;height:auto}

/* ---------- Instagram y WhatsApp (flotantes, junto a Mi progreso) ---------- */
.fab-social{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.fab-soc{display:grid;place-items:center;border-radius:50%;text-decoration:none;box-shadow:0 8px 24px #000c;transition:transform .15s ease}
.fab-soc:active{transform:scale(.94)}
.fab-soc svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab-soc.ig{display:flex;gap:10px;height:54px;padding:8px 18px 8px 8px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);text-align:left}
.fab-ig-ico{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center}
.fab-ig-ico svg{width:20px;height:20px}
.fab-ig-t{display:block;line-height:1.15}
.fab-ig-t b{display:block;font-size:.9rem;font-weight:900}

/* Pantalla de inicio (3 s exactos · centrada · solo transform/opacity animados) */
#splash{position:fixed;inset:0;height:100vh;height:100dvh;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4dvh,18px);text-align:center;

  transition:opacity .5s ease,visibility .5s}

#splash .sp-ring{position:relative;width:100%;height:100%;border-radius:50%;background:#000;display:grid;place-items:center;border:2px solid var(--gold);overflow:hidden;
  box-shadow:0 0 0 8px #4da3ff0d,0 0 60px var(--glow)}
#splash .sp-ring img{display:block;width:100%;height:100%;object-fit:contain;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}

#splash .sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));transform:translateX(-100%);animation:spLoad 2.3s .7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}

.rk{display:grid;gap:6px;margin:4px 0 0}
.rk-r{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.86rem}
.rk-r b{color:var(--gold2);white-space:nowrap}

.fab-soc.ig{width:52px;height:52px;padding:0;border:0;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink)}
.fab-ig-ico{width:auto;height:auto;background:none;color:var(--ink)}
.fab-ig-ico svg{width:26px;height:26px}
.ig-bubble{position:absolute;left:0;bottom:calc(100% + 12px);width:max-content;max-width:calc(100vw - 28px);background:#1a1a1e;color:#f4f4f5;border:1px solid var(--gold-dim);border-radius:14px;padding:8px 12px;font-size:.78rem;font-weight:700;line-height:1.25;box-shadow:0 8px 24px #000c;opacity:0;transform:translateY(6px) scale(.96);transform-origin:20px 100%;transition:opacity .35s,transform .35s;pointer-events:none}
.ig-bubble.show{opacity:1;transform:none}
.ig-bubble::after{content:"";position:absolute;left:18px;top:100%;width:11px;height:11px;margin-top:-6px;background:#1a1a1e;border-right:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);transform:rotate(45deg)}
body:has(.modal.open) .ig-bubble{display:none}

.go{position:fixed;inset:0;z-index:60;background:#0c0c0efa;display:none;place-items:center;text-align:center}
.go.show{display:grid}
.go div{display:grid;gap:8px}
.go b{font-size:clamp(5rem,32vw,9rem);line-height:1;color:var(--gold2);font-weight:900}
.go b.pop{animation:goPop .75s ease-out}
.go span{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
@keyframes goPop{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.go b.pop{animation:none}.ig-bubble{transition:none}}
@media(max-width:359px){.fab-soc.ig{width:48px;height:48px}.pc-t{padding-right:0;margin-top:20px}}

/* ===== v6: auditoría UX — foco, estados, modales, flotantes, ayudas ===== */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button:focus-visible,a:focus-visible,input:focus-visible,.sheet:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.sheet:focus{outline:none}
.circ button:focus-visible,.circ input:focus-visible{outline-color:#04101f}

/* Navegación semanal: el día seleccionado no depende solo del color */
.tab.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold2)}
.tab.on::before{content:"";position:absolute;left:50%;bottom:-9px;width:0;height:0;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold2);border-bottom:0}
.tab.future{border-style:dashed}
.week{padding-bottom:14px}

/* Series: marca visible en las completadas */
.dot{position:relative}
.dot.on::after{content:"✓";position:absolute;right:-3px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--gold2);font-size:.7rem;line-height:18px;font-weight:900}
.circ .dot.on::after{background:#04101f;color:#9fd0ff}
.lg-st{flex-basis:100%;margin-top:8px;font-size:.8rem;font-weight:600;color:var(--muted)}
.lg-st.ok{color:var(--ok)}
.lg-st.bad{color:#b3261e}
.circ .lg-st.ok{color:#0d6b43}
.log input[aria-invalid="true"]{border-color:#b3261e;outline:2px solid #b3261e}

/* Modales: altura dinámica, contenido con scroll y acciones siempre visibles */
.sheet{max-height:calc(100dvh - 24px);scroll-padding-bottom:96px}
.sheet .btn.gold,.sheet .btn.out{position:sticky;bottom:0}
.sheet .btn.gold{box-shadow:0 -10px 14px -6px var(--card)}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
#cfmodal{z-index:70}
#cfmodal .sheet p{color:var(--text);font-size:.92rem;line-height:1.5}

/* Temporizador: lectura principal, controles táctiles y fin de descanso visible */
.tm-btns button{min-width:48px;min-height:48px}
.tm-btns{flex-wrap:wrap;justify-content:flex-end}
.tm-info b{font-size:2.2rem}
.timer.done{background:var(--gold);border-top-color:var(--gold2)}
.timer.done .tm-info b,.timer.done .tm-info small{color:var(--ink)}
.timer.done .tm-btns button{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
@media(max-width:420px){.tm-info small{max-width:26vw}.tm-btns button{padding:0 8px}}

/* Flotantes: jerarquía acción > temporizador > progreso > redes; sin tapar la rutina */
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.fab-prog{box-shadow:0 6px 18px #000a}
.fab-social{z-index:19}
@media(max-width:380px){.fab-prog span:last-child{display:none}.fab-prog{padding:8px}}
@media(max-height:560px){.fab-social{display:none}}

/* Ayudas contextuales: foco, ratón y tacto; sin depender de title */
.fab-soc.wa{position:relative}
.fab-soc.wa::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);width:max-content;max-width:60vw;background:#1a1a1e;color:#f4f4f5;border:1px solid var(--gold-dim);border-radius:10px;padding:6px 10px;font-size:.76rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s}
.fab-soc.wa:hover::after,.fab-soc.wa:focus-visible::after{opacity:1}
.ig-bubble{max-width:min(240px,calc(100vw - 28px))}

/* ===== Adriana · tema azul ===== */
.logo{width:min(150px,40vw)}
.logo img{filter:drop-shadow(0 4px 16px var(--glow))}
#splash .sp-ring img{object-fit:contain;padding:10%}
.slogan img.bb{max-width:70%;filter:drop-shadow(0 4px 18px var(--glow))}
.slogan-txt{font-style:italic;font-weight:900;font-size:clamp(2rem,10vw,2.8rem);color:var(--gold2);letter-spacing:.01em;text-shadow:0 2px 18px var(--glow)}
</style>
</head>

function scheduledBi(date){ const o=readPlan(date)[ymd(date)]; if(o!==undefined) return o; const d=bloquesDelDia(wdOf(date))[0]; return d?d.bi:-1; }
function bloquesDeFecha(date){
  const c=readS(date);
  if(c===null){ if(readPlan(date)[ymd(date)]===undefined) return bloquesDelDia(wdOf(date)); }
  const bi=c===null?scheduledBi(date):c;
  return (bi>=0&&R.bloques[bi])?[{b:R.bloques[bi],bi}]:[];
}
/* Reacomoda el resto de la semana según lo que elegiste hoy: cada tipo conserva las sesiones que le tocan en la semana,
   y no se repite el mismo tipo dos días seguidos. */
function planWeek(todayBi){
  const need={}; R.bloques.forEach((b,bi)=>need[bi]=b.dias.length);
  for(let n=1;n<=todayNum;n++){
    const d=dateOf(n); let bi=null;
    if(n===todayNum) bi=todayBi; else { const c=readS(d); if(c!==null) bi=c; else if(Object.keys(readP(d)).length) bi=scheduledBi(d); }
    if(bi!==null&&bi>=0&&need[bi]>0) need[bi]--;
  }
  const slots=[]; for(let n=todayNum+1;n<=7;n++){ const dd=bloquesDelDia(n)[0]; if(dd) slots.push({n,date:dateOf(n),def:dd.bi}); }
  let prev=todayBi;
  slots.forEach(sl=>{
    const avail=Object.keys(need).map(Number).filter(b=>need[b]>0); let pick=null;
    if(need[sl.def]>0&&sl.def!==prev) pick=sl.def;
    else{ const c=avail.filter(b=>b!==prev), pool=c.length?c:avail;
      if(pool.length){ pool.sort((a,b)=>need[b]-need[a]||((a===sl.def)?-1:(b===sl.def)?1:0)||a-b); pick=pool[0]; } }
    if(pick===null) sl.bi=-1; else { need[pick]--; sl.bi=pick; }
    prev=sl.bi;
  });
  const dropped=Object.keys(need).map(Number).filter(b=>need[b]>0).map(b=>({bi:b,n:need[b]}));
  return {slots,dropped};
}

}

}

function toggleSet(id,k){
  unlockAudio();
  const it=EX[id]; if(!it) return;
  const date=dateOf(selDay), P=getP(selDay), before=statsOf(date).pct, cur=+P[id]||0;
  const nxt=(cur===k+1)?k:k+1; P[id]=nxt; setP(selDay,P);
  if(PREFS.log&&!it.cardio){
    const W=getW(selDay); let en=W[id]; if(!en||!Array.isArray(en.s)) en=W[id]={n:it.n,s:[]};
    en.n=it.n;
    if(nxt>cur){ ACT[id]=nxt-1; for(let j=0;j<nxt;j++) if(en.s[j]===undefined) en.s[j]=null; }
    else{ en.s.length=Math.min(en.s.length,nxt); ACT[id]=nxt>0?nxt-1:null; if(nxt===0) delete en.s; }
    if(en.s) setW(selDay,W); else { delete W[id]; setW(selDay,W); }
  }
  const after=statsOf(date).pct;
  buzz(10); refreshDay();
  if(after===100&&before<100) toast('¡Día completo! Así se hace, campeón 🔥');
  if(after===100) hideTimer(); else if(nxt>cur&&!it.cardio&&PREFS.timer) startRest(it.rest,it.n);
}

  const w=rawW===''?null:parseNum(rawW), r=rawR===''?null:(/^\d+$/.test(rawR)?parseInt(rawR):NaN);

/* Elige una frase distinta cada día: no repite la última que viste en ese nivel de avance */
const phraseFor = (p,seed)=>{
  const k=p===100?'full':p>=80?'high':p>=50?'mid':p>0?'low':'zero', a=PHRASES[k], sk=`ca5:ph:${USER}:${k}`;
  let st=null; try{ st=JSON.parse(localStorage.getItem(sk)||'null'); }catch(e){}
  if(st&&st.seed===seed&&st.i<a.length) return a[st.i];
  let i=hash(seed+'t')%a.length; if(st&&st.i===i) i=(i+1)%a.length;
  try{ localStorage.setItem(sk,JSON.stringify({seed,i})); }catch(e){}
  return a[i];
};
const missLine = it=>it.done>0 ? `${esc(it.n)} <span>· ${it.done} de ${it.s} series</span>` : `${esc(it.n)}`;

function openReview(scope){
  const days = scope==='day' ? [selDay] : Array.from({length:todayNum},(_,i)=>i+1);
  let T_=0,D=0, miss='';
  days.forEach(n=>{
    const st=dayStats(n); T_+=st.t; D+=st.d;
    if(!st.miss.length) return;
    const tit = bloquesDeFecha(dateOf(n)).map(x=>x.b.titulo).join(' + ') || 'Descanso activo';
    let body;
    if(st.d===0 && scope==='week') body = `<ul><li>${esc(tit)} <span>· sin registro</span></li></ul>`;
    else{
      const shown=st.miss.slice(0,6), more=st.miss.length-shown.length;
      body = `<ul>${shown.map(it=>`<li>${missLine(it)}</li>`).join('')}${more>0?`<li><span>y ${more} más…</span></li>`:''}</ul>`;
    }
    miss += `<h4>${DAYS_LONG[n-1]}</h4>${body}`;
  });
  const pct = T_?Math.round(D/T_*100):0;
  const title = scope==='day' ? `Tu ${DAYS_LONG[selDay-1].toLowerCase()}` : (todayNum===7?'Tu semana completa':'Tu semana hasta hoy');
  const verb = pct===100?'¡Lo completaste todo!':`Completaste el ${pct}%`;
  const seed=`${USER}|${scope}|${ymd(scope==='day'?dateOf(selDay):monday)}`, fr=frasePick(seed);

  $('rv').innerHTML = `
    <div class="rv-top">
      <div class="rv-ring" style="--p:${pct}"><div><b>${pct}%</b><small>${D} de ${T_} series</small></div></div>
      <h3 class="rv-title">${verb}</h3><p class="rv-sub">${title}</p>
    </div>
    <div class="rv-phrase"><img src="${esc(fr.src)}" alt="${esc(fr.alt)}" onerror="this.remove()"><p>${esc(firstName())}, ${esc(lc(phraseFor(pct,seed)))}</p></div>
    <div class="rv-miss">${pct===100?'<div class="rv-ok">No te faltó nada. Excelente trabajo.</div>':`<h4 style="margin-top:0">¿Qué te faltó?</h4>${miss||'<ul><li><span>Nada pendiente en lo registrado.</span></li></ul>'}`}</div>`;
  openModal('rvmodal');
}

/* ---------------- Mi progreso ---------------- */
function weekPct(mon){
  let t=0,d=0;
  for(let i=0;i<7;i++){ const dt=new Date(mon); dt.setDate(mon.getDate()+i); if(dt>startOfToday) break; const st=statsOf(dt); t+=st.t; d+=st.d; }
  return {pct:t?Math.round(d/t*100):0,t,d};
}
function allDates(){
  const pre=`ca5:${USER}:`, out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&k.startsWith(pre)&&/^\d{4}-\d{2}-\d{2}$/.test(k.slice(pre.length))){ const [y,m,d]=k.slice(pre.length).split('-').map(Number); out.push(new Date(y,m-1,d)); } } }catch(e){}
  return out.sort((a,b)=>a-b);
}
/* Racha por tipo de entrenamiento: sesiones seguidas de ese tipo terminadas al 100%.
   Una sesión incompleta de un día anterior corta la racha; la de hoy, si aún no termina, no cuenta ni corta. */
function typeStreaks(){
  const typeOf=dt=>{const bl=bloquesDeFecha(dt); return bl.length?bl[0].bi:-1};
  const by={}; R.bloques.forEach((_,bi)=>by[bi]=[]);
  allDates().forEach(dt=>{ const st=statsOf(dt); if(!st.d) return; const t=typeOf(dt); (by[t]=by[t]||[]).push({dt,full:st.t>0&&st.pct===100}); });
  const today=ymd(startOfToday);
  return Object.keys(by).map(Number).filter(t=>t>=0||by[t].length).sort((a,b)=>a-b).map(t=>{
    const a=by[t]; let streak=0;
    for(let i=a.length-1;i>=0;i--){ if(a[i].full) streak++; else if(ymd(a[i].dt)===today) continue; else break; }
    return {bi:t,name:tName(t),streak,done:a.filter(x=>x.full).length};
  });
}
function progressData(){
  const dates=allDates(); let series=0, full=0;
  dates.forEach(dt=>{ const st=statsOf(dt); series+=st.d; if(st.t&&st.pct===100) full++; });
  const types=typeStreaks(), streak=Math.max(0,...types.map(t=>t.streak));
  const wk=weekPct(monday);
  const firstMon=dates.length?(()=>{const d=new Date(dates[0]);d.setDate(d.getDate()-(wdOf(d)-1));return d})():monday;
  const weeks=[]; for(let i=7;i>=0;i--){ const m=new Date(monday); m.setDate(monday.getDate()-7*i); if(m<firstMon) continue; weeks.push({m,p:weekPct(m).pct}); }
  return {dates,series,full,streak,types,wk,weeks};
}
/* Mejor serie por ejercicio y volumen de una semana (lunes = mon) */
function weekLog(mon){
  const out={ex:{},vol:0};
  for(let i=0;i<7;i++){ const dt=new Date(mon); dt.setDate(mon.getDate()+i); const W=readW(dt);
    for(const id in W){ const en=W[id]; if(!en||!Array.isArray(en.s)||String(id).startsWith('c-')) continue;
      en.s.forEach(x=>{ if(!x) return; if(x.w>0&&x.r>0) out.vol+=x.w*x.r;
        if(x.w>0){ const b=out.ex[en.n]; if(!b||x.w>b.w||(x.w===b.w&&(x.r||0)>(b.r||0))) out.ex[en.n]={w:x.w,r:x.r}; } }); } }
  return out;
}
function lastWeekHTML(){
  const pm=new Date(monday); pm.setDate(monday.getDate()-7);
  const pe=new Date(pm); pe.setDate(pm.getDate()+6);
  const lw=weekPct(pm), lg=weekLog(pm), tg=weekLog(monday), tw=weekPct(monday);
  const range=`${pm.getDate()} ${MONTHS[pm.getMonth()]} – ${pe.getDate()} ${MONTHS[pe.getMonth()]}`;
  const names=Object.keys(lg.ex);
  if(!lw.d&&!names.length) return `<h4 class="pg-h">Semana pasada</h4><p class="pg-note">Sin registros del ${esc(range)}.</p>`;
  const bv=(b)=>b?`${fmt(b.w)}×${b.r!=null?b.r:'–'}`:'–';
  const rows=names.map(n=>{
    const a=lg.ex[n], b=tg.ex[n]; let d='<span class="na">·</span>';
    if(b){ const df=Math.round((b.w-a.w)*100)/100; d=df>0?`<span class="up">▲ +${fmt(df)}</span>`:df<0?`<span class="dn">▼ ${fmt(df)}</span>`:'<span class="na">=</span>'; }
    return `<span class="n">${esc(n)}</span><span class="v">${bv(a)}</span><span class="v">${b?bv(b)+' '+d:'<span class="na">pendiente</span>'}</span>`;
  }).join('');
  return `<div class="lw-h"><h4 class="pg-h">Semana pasada</h4><small>${esc(range)}</small></div>
    <div class="tiles">
      <div><b>${lw.pct}%</b><small>constancia</small></div>
      <div><b>${lw.d}</b><small>series hechas</small></div>
      <div><b>${Math.round(lg.vol).toLocaleString('es-MX')}</b><small>${esc(unit())} de volumen</small></div>
    </div>
    ${names.length?`<p class="pg-note">Mejor serie de cada ejercicio (${esc(unit())} × reps), contra esta semana (${tw.pct}% hasta hoy).</p>
    <div class="cmp"><span class="h">Ejercicio</span><span class="h v">Sem. pasada</span><span class="h v">Esta semana</span>${rows}</div>`
    :'<p class="pg-note">No se anotaron pesos esa semana. Desde ahora, escribe tu peso al marcar cada serie y aquí verás la comparación.</p>'}`;
}

  const sb=$('shareProg'); if(sb){ sb.onclick=()=>shareProgress(sb); prepShare(); }

    g.strokeStyle=gr; g.beginPath(); g.arc(rx,ry,rad,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,D.wk.pct/100)); g.stroke(); }
  g.fillStyle=gold2; g.font=`900 92px ${FONT}`; g.fillText(D.wk.pct+'%',rx,ry+30);

let shareBlobP=null;
const prepShare=()=>{ shareBlobP=null; setTimeout(()=>{ shareBlobP=progressImage().catch(()=>null); },60); };
async function shareProgress(btn){
  const label=btn.textContent; btn.disabled=true; btn.textContent='Creando imagen…';
  try{
    if(!shareBlobP) shareBlobP=progressImage();
    const blob=await shareBlobP; if(!blob) throw new Error('sin imagen');
    const file=new File([blob],`mi-progreso-${ymd(startOfToday)}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Mi progreso · Champion Academy MBS'}); }
      catch(e){ if(!e||e.name!=='AbortError') throw e; }
    }else{
      const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Imagen guardada. Súbela a tus historias de Instagram.');
    }
  }catch(e){ toast('No pude crear la imagen. Intenta de nuevo.'); }
  finally{ btn.disabled=false; btn.textContent=label; }
}

/* ---------------- Modales ---------------- */
const FOCUSABLE='button:not([disabled]),a[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
const modalOrigin=new WeakMap();
const openModals=()=>[...document.querySelectorAll('.modal.open')];
function openModal(id){
  const m=$(id); modalOrigin.set(m,document.activeElement);
  m.classList.add('open');
  const h=m.querySelector('h3'); if(h){ if(!h.id) h.id=id+'-t'; m.setAttribute('aria-labelledby',h.id); m.removeAttribute('aria-label'); }
  const sh=m.querySelector('.sheet'); if(sh){ sh.setAttribute('tabindex','-1'); }
  setTimeout(()=>{ const f=m.querySelector('.btn.gold')||m.querySelector(FOCUSABLE)||sh; if(f&&f.focus) f.focus({preventScroll:true}); },30);
}
function closeModal(m){
  m.classList.remove('open');
  const o=modalOrigin.get(m); modalOrigin.delete(m);
  if(o&&o.isConnected&&o.focus&&!openModals().length) setTimeout(()=>{ try{o.focus({preventScroll:true})}catch(e){} },0);
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m&&!m.hasAttribute('data-lock')) closeModal(m); }));
document.addEventListener('keydown',e=>{
  const open=openModals(), top=open[open.length-1]; if(!top) return;
  if(e.key==='Escape'){ if(!top.hasAttribute('data-lock')) closeModal(top); return; }
  if(e.key==='Tab'){
    const f=[...top.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
    if(!f.length){ e.preventDefault(); return; }
    const first=f[0], last=f[f.length-1];
    if(!top.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
/* Confirmación integrada (reemplaza confirm() nativo). Devuelve una promesa true/false. */
function askConfirm({title,body,ok='Confirmar',cancel='Cancelar',danger=false}){
  return new Promise(res=>{
    const m=$('cfmodal'); $('cfT').textContent=title; $('cfB').innerHTML=body;
    const okB=$('cfOk'), noB=$('cfNo'); okB.textContent=ok; noB.textContent=cancel; okB.classList.toggle('danger',!!danger);
    const done=v=>{ okB.onclick=noB.onclick=null; m.onkeydown=null; closeModal(m); res(v); };
    okB.onclick=()=>done(true); noB.onclick=()=>done(false);
    m.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(false); } };
    openModal('cfmodal'); setTimeout(()=>noB.focus({preventScroll:true}),40);
  });
}

/* ---------------- Elegir rutina del día ---------------- */
let pickSel=-1, pickFirst=false;
const needPick = ()=>readS(startOfToday)===null && !Object.keys(getP(todayNum)).length;
function openPick(first){
  pickFirst=!!first;
  const defBi=scheduledBi(startOfToday), cur=readS(startOfToday);
  pickSel=cur!==null?cur:defBi;
  const ts=typeStreaks(), stOf=bi=>ts.find(t=>t.bi===bi)||{streak:0};
  const cnt=b=>b.circuitos.reduce((a,c)=>a+c.ejercicios.length,0), ser=b=>b.circuitos.reduce((a,c)=>a+c.ejercicios.reduce((x,e)=>x+Math.max(1,parseInt(e.series)||1),0),0);
  const card=(bi,t,sub)=>{ const k=stOf(bi).streak;
    return `<button type="button" class="pc" role="radio" aria-checked="${pickSel===bi}" data-bi="${bi}"><span class="pc-t">${esc(t)}</span><span class="pc-s">${esc(sub)}</span><span class="pc-k">Racha: ${k} ${k===1?'sesión':'sesiones'}${k?' 🔥':''}</span>${bi===defBi?'<i class="pc-tag">Te toca hoy</i>':''}</button>`; };
  const d=startOfToday;
  $('pick').innerHTML=`
    <h3>¿Qué entrenas hoy?</h3>
    <p class="pk-d">${DAYS_LONG[todayNum-1]} ${d.getDate()} de ${MONTHS[d.getMonth()]}. Elige tu rutina y tus preferencias.</p>
    <div class="pcs" role="radiogroup" aria-label="Rutina de hoy">
      ${R.bloques.map((b,bi)=>card(bi,b.titulo,`${cnt(b)} ejercicios · ${ser(b)} series`)).join('')}
      ${card(-1,'Solo cardio','Día de recuperación activa')}
    </div>
    <div class="pl" id="plan"></div>
    <h4 class="pg-h">Preferencias</h4>
    <label class="sw"><input type="checkbox" id="pfLog" ${PREFS.log?'checked':''}><span><b>Registrar peso y repeticiones</b><small>Opcional. Anota el peso y las reps de cada serie mientras entrenas.</small></span></label>
    <label class="sw"><input type="checkbox" id="pfTimer" ${PREFS.timer?'checked':''}><span><b>Temporizador de descanso</b><small>Cuenta regresiva después de cada serie.</small></span></label>
    <button class="btn gold" id="pickGo" style="margin-top:12px">${pickFirst?'Empezar':'Guardar cambios'}</button>
    ${pickFirst?'':'<button class="btn out" id="pickX">Cancelar</button>'}`;
  const paintPlan=()=>{
    const pl=planWeek(pickSel), moved=pickSel!==defBi;
    const rows=pl.slots.map(sl=>`<div class="pl-r${sl.bi!==sl.def?' mv':''}"><span>${DAYS[sl.n-1]} ${sl.date.getDate()}</span><span>${esc(sl.bi>=0?tName(sl.bi):'Solo cardio')}</span></div>`).join('');
    $('plan').innerHTML=`<b>${moved?`Hoy te tocaba ${esc(tName(defBi))}. Así acomodamos tu semana:`:'Así sigue tu semana:'}</b>${rows||'<div class="pl-r"><span>Resto de la semana</span><span>Descanso</span></div>'}`+
      (pl.dropped.length?`<p class="pl-w">Esta semana ya no alcanzan los días para: ${pl.dropped.map(d=>esc(tName(d.bi))+(d.n>1?` (${d.n})`:'')).join(', ')}. Se quedan pendientes.</p>`:'');
  };
  paintPlan();
  $('pick').querySelectorAll('.pc').forEach(b=>b.onclick=()=>{ pickSel=+b.dataset.bi; $('pick').querySelectorAll('.pc').forEach(x=>x.setAttribute('aria-checked',+x.dataset.bi===pickSel)); paintPlan(); });
  $('pickGo').onclick=async()=>{
    const curBi=(bloquesDeFecha(startOfToday)[0]||{bi:-1}).bi;
    if(!pickFirst&&pickSel!==curBi&&Object.keys(getP(todayNum)).length){
      const st=statsOf(startOfToday), pl0=planWeek(pickSel);
      const moved=pl0.slots.filter(sl=>sl.bi!==sl.def).map(sl=>`${DAYS[sl.n-1]} ${sl.date.getDate()}: ${esc(sl.bi>=0?tName(sl.bi):'Solo cardio')}`);
      const ok=await askConfirm({title:'¿Cambiar la rutina de hoy?',
        body:`Hoy ya llevas <b>${st.d} series</b> en <b>${esc(tName(curBi))}</b>. Si cambias a <b>${esc(tName(pickSel))}</b>, ese avance <b>dejará de contar</b> en tu progreso de hoy.${moved.length?`<br><br>Cambiarían estos días: ${moved.join(' · ')}.`:''}`,
        ok:'Sí, cambiar',cancel:'Mantener la actual',danger:true});
      if(!ok) return;
    }
    unlockAudio();
    const pl=planWeek(pickSel), o={}; const old=readPlan(startOfToday); Object.keys(old).forEach(k=>{ if(k<=ymd(startOfToday)) o[k]=old[k]; });
    pl.slots.forEach(sl=>{ o[ymd(sl.date)]=sl.bi; }); writePlan(startOfToday,o);
    const shifted=pickSel!==scheduledBi(startOfToday)||pl.slots.some(sl=>sl.bi!==sl.def);
    writeS(startOfToday,pickSel); if($('pfLog')&&!$('pfLog').closest('.pk-off')){ PREFS.log=$('pfLog').checked; PREFS.timer=$('pfTimer').checked; } PREFS.seen=true; savePrefs();
    if(!PREFS.timer) hideTimer();
    closeModal($('pickmodal')); selDay=todayNum; render(); window.scrollTo({top:0});
    if(pickFirst) countdown();
    if(shifted) setTimeout(()=>toast('Ajusté el resto de tu semana según tu elección'),pickFirst?4200:300);
  };
  if($('pickX')) $('pickX').onclick=()=>closeModal($('pickmodal'));
  if(pickFirst&&PREFS.seen&&cur===null){   // ya conoces sus preferencias: una sola pregunta, sin formulario
    const last=allDates().filter(x=>ymd(x)<ymd(startOfToday)).pop(), ls=last?statsOf(last):null;
    const lastLine=last&&ls.d?` Tu última sesión: ${esc(tName(typeOfDate(last)))} · ${ls.pct}%.`:'';
    const k=(ts.find(t=>t.bi===defBi)||{streak:0}).streak;
    const box=document.createElement('div'); box.className='pk-quick';
    box.innerHTML=`<h3>¡Hola de nuevo, ${esc(firstName())}!</h3>
      <p class="pk-d">${DAYS_LONG[todayNum-1]} ${d.getDate()} de ${MONTHS[d.getMonth()]}.${lastLine}</p>
      <div class="pcs"><div class="pc quick"><span class="pc-s">Hoy te toca</span><span class="pc-t" style="padding-right:0">${esc(tName(defBi))}</span><span class="pc-k">Racha: ${k} ${k===1?'sesión':'sesiones'}${k?' 🔥':''}</span></div></div>
      <p class="pk-d">Peso y repeticiones: <b>${PREFS.log?'sí':'no'}</b> · Temporizador de descanso: <b>${PREFS.timer?'sí':'no'}</b></p>
      <button class="btn gold" id="pickKeep">Seguir así</button>
      <button class="btn out" id="pickMore">Cambiar rutina o preferencias</button>`;
    [...$('pick').children].forEach(el=>el.classList.add('pk-off')); $('pick').prepend(box);
    $('pickKeep').onclick=()=>$('pickGo').click();
    $('pickMore').onclick=()=>{ box.remove(); [...$('pick').children].forEach(el=>el.classList.remove('pk-off')); };
  }
  openModal('pickmodal');
}
let goT=0;
function countdown(){
  const g=$('go'), n=$('goN'), lab=g.querySelector('span'); let c=3; g.classList.add('show'); clearTimeout(goT);
  const end=()=>{ clearTimeout(goT); g.classList.remove('show'); g.onclick=null; };
  g.onclick=end;
  const step=()=>{
    if(c>0){ n.textContent=c; n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); lab.textContent='Prepárate'; buzz(15); c--; goT=setTimeout(step,800); }
    else{ n.textContent='¡Vamos!'; lab.textContent='A entrenar'; n.style.fontSize='clamp(3rem,18vw,5rem)'; goT=setTimeout(()=>{ n.style.fontSize=''; end(); },700); }
  };
  step();
}
/* Globito de Instagram: aparece unos segundos y se va solo (máx. 4 veces) */
function igBubble(){
  const b=$('igBubble'); if(!b) return; let n=0; try{ n=+localStorage.getItem('ca5:igb')||0; }catch(e){}
  if(n>=4) return; try{ localStorage.setItem('ca5:igb',String(n+1)); }catch(e){}
  b.classList.add('show'); const off=()=>b.classList.remove('show');
  setTimeout(off,6500); document.querySelector('.fab-soc.ig').addEventListener('click',off,{once:true});
}
